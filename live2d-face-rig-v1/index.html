<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live2D · 目と口の開閉</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: #e8ebeb; color: #17292c; font: 16px/1.55 system-ui, sans-serif; }
  main { width: min(100%, 802px); display: grid; grid-template-columns: minmax(0,470px) minmax(0,300px);
    gap: 32px; align-items: center; }
  #stage { width: 100%; aspect-ratio: 1199/1312; overflow: hidden;
    border-radius: 16px; background: #c5c9d0; }
  canvas { display: block; width: 100%; height: auto; }
  section { width: min(300px, 100%); }
  h1 { margin: 0 0 12px; font-size: 25px; }
  button { font: inherit; background: #254e52; color: white; border: 0;
    padding: 9px 14px; border-radius: 7px; cursor: pointer; margin: 0 4px 10px 0; }
  button:disabled { opacity: .45; cursor: default; }
  label { display: grid; gap: 2px; margin: 14px 0; }
  input { width: 100%; accent-color: #254e52; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets[hidden] { display: none; }
  .presets button { margin: 0; padding: 5px 8px; font-size: 13px; }
  .presets button[aria-pressed="false"] { background: #d7e1e1; color: #17292c; }
  a { color: #254e52; }
  #status { min-height: 1.55em; margin-bottom: 4px; }
  @media (max-width: 680px) {
    main { grid-template-columns: minmax(0,470px); justify-content: center; gap: 18px; }
  }
</style>
<main>
  <div id="stage"></div>
  <section>
    <h1>目と口の開閉</h1>
    <button id="play" disabled>再生</button>
    <button id="pause" disabled>一時停止</button>
    <label>両目の開き<input id="eye" type="range" min="0" max="1" step=".01" value="1" disabled></label>
    <label>口の開き<input id="mouth" type="range" min="0" max="1" step=".01" value="0" disabled></label>
    <div id="presets" class="presets" role="group" aria-label="口の4つの形" hidden>
      <button data-open="0" aria-pressed="true">閉じ口</button>
      <button data-open=".3" aria-pressed="false">少し開く</button>
      <button data-open=".66" aria-pressed="false">半開き</button>
      <button data-open="1" aria-pressed="false">全開</button>
    </div>
    <p id="status" role="status">読み込み中…</p>
    <a id="compare" href="?version=1">前のモデルを見る</a>
    <button id="frames" hidden>確認用フレームを書き出す</button>
  </section>
</main>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script type="module">
  import { blink, mouth, duration, sample } from "./motion-keys.mjs";

  const byId = id => document.getElementById(id);
  const [play, pause, eyeControl, mouthControl, status, frames] =
    ["play", "pause", "eye", "mouth", "status", "frames"].map(byId);
  const params = new URLSearchParams(location.search);
  const oldModel = params.get("version") === "1";
  const mouthPresets = [...byId("presets").querySelectorAll("button")];
  const compare = byId("compare");
  if (oldModel) {
    compare.href = "./";
    compare.textContent = "今回のモデルを見る";
  }
  const width = 480, height = Math.round(width * 1312 / 1199);

  try {
    const app = new PIXI.Application({ width, height, backgroundColor: 0xc5c9d0, antialias: true,
      preserveDrawingBuffer: true, autoStart: false });
    byId("stage").append(app.view);
    const modelPath = oldModel ? "face-rig.model3.json" : "v2/face-rig-v2.model3.json";
    const model = await PIXI.live2d.Live2DModel.from(modelPath, {
      autoInteract: false, autoUpdate: false,
    });
    model.scale.set(width / model.internalModel.originalWidth);
    app.stage.addChild(model);
    const core = model.internalModel.coreModel;
    const ids = ["ParamEyeLOpen", "ParamEyeROpen", "ParamMouthOpenY"].map(id => core.getParameterIndex(id));
    let start = performance.now();
    let playing = true;
    let raf;
    // AI_NOTE: Apply the same model parameters when playing, scrubbing, or exporting comparison frames.
    function render(eye, mouthOpen) {
      core.setParameterValueByIndex(ids[0], eye);
      core.setParameterValueByIndex(ids[1], eye);
      core.setParameterValueByIndex(ids[2], mouthOpen);
      core.saveParameters();
      model.update(1000 / 60);
      app.render();
      for (const button of mouthPresets) {
        button.setAttribute("aria-pressed", Number(button.dataset.open) === mouthOpen);
      }
    }
    function at(time) {
      const eye = sample(blink, time), mouthOpen = sample(mouth, time);
      render(eye, mouthOpen);
      eyeControl.value = eye;
      mouthControl.value = mouthOpen;
    }
    function tick(now) {
      if (!playing) return;
      const time = ((now - start) / 1000) % duration;
      at(time);
      status.textContent = time < 3.7 ? "まばたき" : "口パク（無音）";
      raf = requestAnimationFrame(tick);
    }
    function stop() {
      playing = false;
      cancelAnimationFrame(raf);
      status.textContent = "手動で調整できます";
    }
    play.onclick = () => {
      stop();
      start = performance.now();
      playing = true;
      raf = requestAnimationFrame(tick);
    };
    pause.onclick = stop;
    eyeControl.oninput = mouthControl.oninput = () => {
      stop();
      render(Number(eyeControl.value), Number(mouthControl.value));
    };
    if (!oldModel) {
      byId("presets").hidden = false;
      for (const button of mouthPresets) {
        button.onclick = () => {
          mouthControl.value = button.dataset.open;
          mouthControl.oninput();
        };
      }
    }
    [play, pause, eyeControl, mouthControl].forEach(control => { control.disabled = false; });
    if (params.has("frames")) {
      frames.hidden = false;
      // AI_NOTE: Capture the actual Cubism canvas so stills and GIFs use the same renderer as the viewer.
      frames.onclick = () => {
        stop();
        const capture = params.get("frames");
        const poseSets = new Map([
          ["poses", [[1, 0], [.75, 0], [.5, 0], [.25, 0], [0, 0], [1, .3], [1, .66], [1, 1]]],
          ["blink", [.2, .12, .09, .07, .05, .03, .01, 0].map(eye => [eye, 0])],
        ]);
        const poses = poseSets.get(capture);
        const w = 360, h = 394, fps = 15, cols = poses ? 4 : 10;
        const total = poses?.length ?? duration * fps;
        const sheet = Object.assign(document.createElement("canvas"), {
          width: w * cols, height: h * Math.ceil(total / cols),
        });
        const ctx = sheet.getContext("2d");
        for (let i = 0; i < total; i++) {
          if (poses) render(...poses[i]);
          else at(i / fps);
          ctx.drawImage(app.view, w * (i % cols), h * Math.floor(i / cols), w, h);
        }
        sheet.toBlob(blob => {
          if (!blob) return;
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          const modelName = oldModel ? "face-rig" : "face-rig-v2";
          a.download = `${modelName}-${poses ? capture : "frames"}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 30000);
        });
        at(0);
      };
    }
    at(0);
    raf = requestAnimationFrame(tick);
  } catch (error) {
    status.textContent = "モデルの読み込みに失敗しました";
    console.error(error);
  }
</script>
</html>
